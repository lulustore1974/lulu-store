<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | Lulu Store</title>
<style>
:root{--a:#b85d35;--d:#211a17;--m:#756b65;--bg:#f7f2ed;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#f1dfd2,#faf7f4);color:var(--d);min-height:100vh}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px #4b2b1b18}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--d);margin-bottom:28px}.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--d);color:#fff;font-weight:800;font-size:22px}.brand strong{font-size:23px}
h1{font-size:32px;margin:0 0 8px}p{color:var(--m);line-height:1.8}.field{margin:17px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #d9cec6;border-radius:12px;outline:none}.field input:focus{border-color:var(--a)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}.secondary{display:block;text-align:center;padding:13px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--d);font-weight:700;margin-top:12px}.msg{margin:12px 0;padding:11px 13px;border-radius:11px;background:#f7f1ed;color:#7f3e24}.success{background:#effaf4;color:#176844}
.small{text-align:center;font-size:13px;margin-top:18px}.small a{color:var(--a);font-weight:700}
</style></head>
<body><main class="wrap"><section class="card">
<a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a>
<h1>تسجيل الدخول</h1><p>بيانات الحساب</p>
<div id="msg"></div>
<div class="field"><label for="identifier">رقم الهاتف</label><input id="identifier" type="tel" inputmode="tel" autocomplete="tel" placeholder="+2010xxxxxxxx"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" id="login">دخول</button>
<button class="secondary" id="resetStart" type="button">نسيت كلمة المرور؟</button>
<a class="secondary" href="signup.html">عميل جديد؟ إنشاء حساب</a>
<a class="secondary" href="https://wa.me/201515899765" target="_blank" rel="noopener">الدعم الفني عبر واتساب</a>
<p class="small"><a href="index.html">العودة إلى المتجر</a></p>
</section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const normalizePhone=s=>{let v=String(s||'').trim().replace(/\D/g,'');if(v.startsWith('20'))v='0'+v.slice(2);if(v.length===10&&v.startsWith('1'))v='0'+v;return /^01[0-9]{9}$/.test(v)?v:null};
const customerEmail=p=>'customer.'+p.replace(/\D/g,'')+'@lulustore1974.com';
const next=new URLSearchParams(location.search).get('next')||'index.html';
async function redirectIfLoggedIn(){const{data:{session}}=await sb.auth.getSession();if(session){const role=session.user.app_metadata?.role;if(role==='admin'){location.href='admin-v4.html';return}if(role==='customer')location.href=next&&!next.startsWith('admin')?next:'index.html'}}
redirectIfLoggedIn();
const msg=document.getElementById('msg');const $=id=>document.getElementById(id);function show(t,ok=false){msg.className='msg '+(ok?'success':'');msg.textContent=t}
$('resetStart').onclick=async()=>{const phone=normalizePhone($('identifier').value);if(!phone){show('اكتب رقم الهاتف أولاً.');return}const{data,error}=await sb.rpc('customer_request_password_reset',{p_phone:phone});if(error||data!==true){show('تعذر إرسال الطلب. تأكد من رقم الهاتف.');return}show('تم إرسال طلب إعادة تعيين كلمة المرور للدعم الفني. انتظر تواصل الدعم معك.',true)};
document.getElementById('login').onclick=async()=>{const identifier=document.getElementById('identifier').value.trim(),password=document.getElementById('password').value;const phone=normalizePhone(identifier);const isManagerEmail=identifier.includes('@');if((!phone&&!isManagerEmail)||!password){show('أدخل رقم الهاتف وكلمة المرور.');return}show('جارٍ الدخول...');let loginEmail=identifier;
if(!isManagerEmail){const{data:aliasData}=await sb.rpc('customer_login_email',{p_phone:phone});loginEmail=aliasData||customerEmail(phone)}
const{data,error}=await sb.auth.signInWithPassword({email:loginEmail,password});if(error){show('رقم الهاتف أو كلمة المرور غير صحيحة.');return}
const role=data.user?.app_metadata?.role;
if(role==='admin'||String(data.user?.email||'').toLowerCase()==='lulustore1974@gmail.com'){location.href='admin-v4.html';return}
location.href=next&&!next.startsWith('admin')?next:'index.html'};
</script>
</body></html>
