<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | Lulu Store</title><style>body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0}.box{max-width:430px;margin:50px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0001}h1{text-align:center;color:#ff7300}input,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font:inherit}button{background:#ff7300;color:#fff;border:0;cursor:pointer}.msg{text-align:center;color:#b44}.muted{color:#777;font-size:13px}a{color:#e76500}</style></head><body><div class="box"><h1>Lulu Store</h1><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><p id="msg" class="msg"></p><hr><h3>إنشاء حساب عميل</h3><input id="name" placeholder="الاسم"><input id="newemail" type="email" placeholder="البريد الإلكتروني"><input id="newpass" type="password" placeholder="كلمة المرور"><button id="signup">إنشاء الحساب</button><p class="muted">دور المدير يحدد تلقائياً من النظام.</p><p><a href="index.html">العودة للمتجر</a></p></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY),msg=document.getElementById('msg');document.getElementById('login').onclick=async()=>{msg.textContent='جارٍ الدخول...';const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent=error.message;return}location.href=data.user.app_metadata?.role==='admin'?'admin.html':'index.html'};document.getElementById('signup').onclick=async()=>{msg.textContent='جارٍ إنشاء الحساب...';const{data,error}=await sb.auth.signUp({email:document.getElementById('newemail').value.trim(),password:document.getElementById('newpass').value,options:{data:{name:document.getElementById('name').value.trim()}}});if(error){msg.textContent=error.message;return}msg.textContent=data.session?'تم إنشاء الحساب وتسجيل الدخول.':'تم إنشاء الحساب؛ أكّد البريد الإلكتروني إذا طلب منك ذلك.'}</script></body></html>
