<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | Lulu Store</title>
<style>
:root{--a:#b85d35;--d:#211a17;--m:#756b65;--bg:#f7f2ed;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#f1dfd2,#faf7f4);color:var(--d);min-height:100vh}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px #4b2b1b18}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--d);margin-bottom:28px}.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--d);color:#fff;font-weight:800;font-size:22px}.brand strong{font-size:23px}
h1{font-size:32px;margin:0 0 8px}p{color:var(--m);line-height:1.8}.field{margin:17px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #d9cec6;border-radius:12px;outline:none}.field input:focus{border-color:var(--a)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}.secondary{display:block;text-align:center;padding:13px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--d);font-weight:700;margin-top:12px}.msg{margin:12px 0;padding:11px 13px;border-radius:11px;background:#f7f1ed;color:#7f3e24}.success{background:#effaf4;color:#176844}
.small{text-align:center;font-size:13px;margin-top:18px}.small a{color:var(--a);font-weight:700}
</style></head>
<body><main class="wrap"><section class="card">
<a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a>
<h1>تسجيل الدخول</h1><p>بيانات الحساب</p>
<div id="msg"></div>
<div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn" id="login">دخول</button>
<a class="secondary" href="signup.html">عميل جديد؟ إنشاء حساب</a>
<a class="secondary" href="mailto:lulustore1974@gmail.com?subject=دعم%20فني%20-%20Lulu%20Store">الدعم الفني</a>

<p class="small"><a href="index.html">العودة إلى المتجر</a></p>
</section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),msg=document.getElementById('msg'),next=new URLSearchParams(location.search).get('next')||'index.html';
function show(t,ok=false){msg.className='msg '+(ok?'success':'');msg.textContent=t}
const registered=new URLSearchParams(location.search).get('registered');if(registered)show('تم إنشاء الحساب. إذا كان البريد يحتاج تأكيداً، افتح رسالة التأكيد ثم سجّل الدخول.',true);
async function redirectIfLoggedIn(){const{data:{session}}=await sb.auth.getSession();if(session){const role=session.user.app_metadata?.role;if(role==='admin')location.href='admin.html';else location.href=next && !next.startsWith('admin')?next:'index.html'}}
redirectIfLoggedIn();
document.getElementById('login').onclick=async()=>{
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password){show('أدخل البريد الإلكتروني وكلمة المرور.');return}
 show('جارٍ التحقق...');
 const{data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){show('بيانات الدخول غير صحيحة أو الحساب يحتاج إلى تأكيد البريد الإلكتروني.');return}
 const role=data.user.app_metadata?.role;
if(role==='admin'){location.href='admin.html';return}
location.href=next && !next.startsWith('admin')?next:'index.html';
};
</script>\n</body></html>
