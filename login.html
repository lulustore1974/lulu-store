<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | Lulu Store</title><link rel="stylesheet" href="css/style.css?v=20260920-2"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">L</span><strong>Lulu Store</strong></a><h1>أهلاً بك من جديد</h1><p class="sub">سجلي الدخول لإدارة سلتك وإتمام طلبك ومتابعة مشترياتك.</p><div id="msg"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button class="main-btn" id="login">تسجيل الدخول</button><div class="divider">أو</div><h3 style="margin-bottom:4px">حساب جديد</h3><p class="sub" style="font-size:13px">إنشاء حساب العميل مجاني، ومن خلاله تصبح السلة والطلبات مرتبطة بحسابك.</p><div class="field"><label>الاسم</label><input id="name" placeholder="الاسم بالكامل"></div><div class="field"><label>البريد الإلكتروني</label><input id="newemail" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="newpass" type="password" placeholder="6 أحرف أو أكثر"></div><button class="ghost-btn" id="signup">إنشاء حساب</button><p class="muted" style="font-size:12px;margin-top:15px">دور المدير يحدد تلقائياً من النظام ولا يمكن اختياره من المستخدم.</p><p><a href="index.html">← العودة للمتجر</a></p></div>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY),msg=document.getElementById('msg'),next=new URLSearchParams(location.search).get('next')||'index.html';function show(t,ok=false){msg.className='notice '+(ok?'success':'');msg.textContent=t}document.getElementById('login').onclick=async()=>{show('جارٍ تسجيل الدخول...');const{data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){show(error.message);return}location.href=data.user.app_metadata?.role==='admin'?'admin.html':next};document.getElementById('signup').onclick=async()=>{if(!name.value.trim()||!newemail.value.trim()||newpass.value.length<6){show('أكملي الاسم والبريد وكلمة المرور (6 أحرف على الأقل).');return}show('جارٍ إنشاء الحساب...');const{data,error}=await sb.auth.signUp({email:newemail.value.trim(),password:newpass.value,options:{data:{name:name.value.trim()}}});if(error){show(error.message);return}show(data.session?'تم إنشاء الحساب وتسجيل الدخول.':'تم إنشاء الحساب. افتحي بريدك الإلكتروني واضغطي رابط التأكيد ثم سجلي الدخول.',true)};</script></body></html>
