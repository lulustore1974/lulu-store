<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة Lulu Store</title><style>body{font-family:Arial;background:#f5f5f5;padding:20px}.box{background:white;padding:18px;max-width:900px;margin:15px auto;border-radius:15px}input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #ddd}button{background:#ff7300;color:white;border:0}.item{padding:10px;border-bottom:1px solid #eee}</style><div class="box"><h1>Lulu Store — لوحة المدير</h1><p>هذه الصفحة محمية بحساب المدير.</p><button id="out">خروج</button><div id="list">جاري التحقق...</div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const s=createClient(SUPABASE_URL,SUPABASE_KEY);async function load(){const u=await s.auth.getUser();if(!u.data.user||u.data.user.app_metadata?.role!=='admin'){location.href='login.html';return}const r=await s.from('products').select('id,name,price,active').order('created_at',{ascending:false});list.innerHTML=(r.data||[]).map(p=>'<div class="item"><b>'+p.name+'</b> — '+p.price+' جنيه — '+(p.active?'نشط':'متوقف')+'</div>').join('')||'لا توجد منتجات'}out.onclick=async()=>{await s.auth.signOut();location.href='login.html'};load()</script></html>
