<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>السلة | Lulu Store</title>
<style>
:root{--a:#b85d35;--d:#211a17;--m:#756b65;--bg:#f7f2ed;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--d)}button,input,textarea{font:inherit}button{cursor:pointer}.container{width:min(1180px,92%);margin:auto}
.header{background:#fff;border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--d)}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--d);color:#fff;font-weight:800}.nav a{padding:10px 15px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--d);font-weight:700}
main{padding:38px 0 60px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.box h2,.box h3{margin-top:0}
.row{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.row img{width:82px;height:96px;object-fit:cover;border-radius:12px}.muted{color:var(--m)}.qty{display:flex;gap:7px;align-items:center;margin-top:10px}.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#eee}.remove{border:0;background:none;color:#a33;font-weight:700}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin:15px 0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d9cec6;border-radius:11px}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#f7f1ed}.success{background:#effaf4;color:#176844}.empty{text-align:center;padding:35px;color:var(--m)}
@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(max-width:560px){.row{grid-template-columns:62px 1fr}.row img{width:62px;height:75px}.row>strong{grid-column:2}}
</style></head>
<body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a><a href="index.html">متابعة التسوق</a></div></header>
<main class="container"><h1>السلة</h1><div class="layout">
<section class="box"><div id="items"></div></section>
<aside class="box"><h3>بيانات الطلب</h3><div class="total"><span>الإجمالي</span><span><span id="total">0</span> جنيه</span></div>
<div class="field"><label for="name">الاسم بالكامل</label><input id="name"></div>
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone"></div>
<div class="field"><label for="gov">المحافظة</label><input id="gov"></div>
<div class="field"><label for="address">العنوان بالتفصيل</label><textarea id="address" rows="3"></textarea></div>
<div class="field"><label for="notes">ملاحظات</label><textarea id="notes" rows="2"></textarea></div>
<button class="btn" id="submit">تأكيد الطلب</button><div id="msg"></div>
</aside></div></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),itemsEl=document.getElementById('items'),totalEl=document.getElementById('total'),msg=document.getElementById('msg');let cart=[];
function readCart(){try{return JSON.parse(localStorage.getItem('lulu_cart')||'[]')}catch{return[]}}
async function init(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){location.href='login.html?next=checkout.html';return}
 cart=readCart();render();
}
function render(){
 if(!cart.length){itemsEl.innerHTML='<div class="empty">السلة فارغة.<br><br><a href="index.html">العودة إلى المنتجات</a></div>';totalEl.textContent='0';return}
 itemsEl.innerHTML=cart.map((x,i)=>'<div class="row"><img src="'+(x.image||'')+'" alt=""><div><strong>'+x.name+'</strong><div class="muted">'+Number(x.price).toLocaleString('ar-EG')+' جنيه</div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><b>'+x.quantity+'</b><button onclick="changeQty('+i+',1)">+</button><button class="remove" onclick="removeItem('+i+')">حذف</button></div></div><strong>'+Number(Number(x.price)*x.quantity).toLocaleString('ar-EG')+' جنيه</strong></div>').join('');
 totalEl.textContent=cart.reduce((s,x)=>s+Number(x.price)*Number(x.quantity||0),0).toLocaleString('ar-EG');
}
window.changeQty=(i,d)=>{cart[i].quantity+=d;if(cart[i].quantity<1)cart.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(cart));render()};
window.removeItem=i=>{cart.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(cart));render()};
document.getElementById('submit').onclick=async()=>{
 if(!cart.length){msg.textContent='السلة فارغة.';return}
 const customer_name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),gov=document.getElementById('gov').value.trim(),address=document.getElementById('address').value.trim(),notes=document.getElementById('notes').value.trim();
 if(!customer_name||!phone||!address){msg.textContent='أكمل الاسم ورقم الهاتف والعنوان.';return}
 msg.textContent='جارٍ تسجيل الطلب...';
 const{data,error}=await sb.rpc('place_order',{p_customer_name:customer_name,p_phone:phone,p_governorate:gov,p_address:address,p_notes:notes,p_items:cart.map(x=>({product_id:x.id,quantity:x.quantity,size:x.size||'',color:x.color||''}))});
 if(error){msg.textContent='تعذر تسجيل الطلب حالياً.';return}
 localStorage.removeItem('lulu_cart');cart=[];render();msg.className='msg success';msg.innerHTML='تم تسجيل الطلب بنجاح. رقم الطلب: <b>'+data.toString().slice(0,8)+'</b><br><br><a href="customer.html" style="display:inline-block;padding:10px 14px;background:#b85d35;color:#fff;border-radius:10px;text-decoration:none;font-weight:700">متابعة طلباتي</a>';
};
init();
</script><script src="./js/lang.js"></script>\n</body></html>
