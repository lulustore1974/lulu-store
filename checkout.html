<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة وإتمام الطلب | Lulu Store</title><style id="lulu-new-design">
:root{--b:#b85d35;--bd:#7f3e24;--ink:#211a17;--mut:#756b65;--bg:#f7f2ed;--card:#fff;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Tahoma",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.container{width:min(1180px,92%);margin:auto}
.site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800;font-size:21px}.brand strong{font-size:22px}.nav-actions{display:flex;gap:8px}.nav-btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:12px;font-weight:700}.nav-btn.primary,.main-btn{background:var(--b);border-color:var(--b);color:#fff}.count{display:inline-grid;place-items:center;min-width:22px;height:22px;background:#fff;color:var(--b);border-radius:50%;margin-right:5px}
.hero{padding:55px 0;background:linear-gradient(135deg,#fff,#f0e0d5)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.15;margin:15px 0}.hero h1 span{color:var(--b)}.hero p{font-size:17px;color:var(--mut);line-height:2}.hero-card{min-height:300px;border-radius:28px;padding:30px;background:linear-gradient(145deg,#211a17,#9a5c40);color:#fff;display:flex;flex-direction:column;justify-content:end}.hero-card .big{font-size:30px;font-weight:800}.notice{display:inline-block;padding:7px 12px;border-radius:30px;background:#fff3eb;color:var(--bd);font-size:13px;font-weight:700}
main.container{padding:40px 0 70px}.section-head h2{font-size:28px;margin-bottom:5px}.section-head p,.sub,.muted{color:var(--mut)}.categories{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 28px}.chip{padding:9px 15px;border:1px solid var(--line);background:#fff;border-radius:30px;font-weight:700}.chip.active{background:var(--ink);color:#fff}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.product-img{height:280px;background:#eee;position:relative}.product-img img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:12px;right:12px;background:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.product-body{padding:17px}.product-body h3{margin:0 0 6px}.product-body p{color:var(--mut);min-height:42px}.price{font-size:20px;font-weight:800;color:var(--bd);margin:10px 0}.add{width:100%;padding:12px;border:0;border-radius:11px;background:var(--ink);color:#fff;font-weight:700}.empty{padding:35px;background:#fff;border:1px dashed #d5c8be;border-radius:18px;text-align:center;grid-column:1/-1}.footer{padding:35px 0;background:var(--ink);color:#fff}
.auth-page{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#f1dfd2,#faf7f4)}.auth-card{width:min(520px,100%);background:#fff;border-radius:25px;padding:32px;border:1px solid var(--line);box-shadow:0 20px 60px #4b2b1b18}.auth-card h1{font-size:30px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #d9cec6;border-radius:11px;background:#fff}.main-btn{width:100%;padding:13px;border:0;border-radius:12px;font-weight:800}.ghost-btn{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px}.divider{text-align:center;color:#aaa;margin:22px 0}
.cart-page{padding:35px 0}.cart-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}.cart-list,.summary{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.cart-row{display:grid;grid-template-columns:80px 1fr auto auto;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cart-row img{width:80px;height:95px;object-fit:cover;border-radius:10px}.qty{display:flex;gap:7px;align-items:center}.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#eee}.remove{background:none;border:0;color:#b43f3f;font-weight:700}.summary{height:max-content;position:sticky;top:90px}.total-line{display:flex;justify-content:space-between;font-size:20px;font-weight:800;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0}
.dashboard{min-height:100vh;background:#f4f1ee}.dashbar{height:72px;background:var(--ink);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.dash-layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:#fff;padding:18px 12px;border-left:1px solid var(--line)}.side-link{display:block;width:100%;padding:12px 14px;text-align:right;border:0;border-radius:10px;background:none;font-weight:700;color:#665d57;margin-bottom:5px}.side-link.active,.side-link:hover{background:#f5e8df;color:var(--bd)}.dash-main{padding:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat small{color:var(--mut)}.stat strong{display:block;font-size:30px;margin-top:7px}.panel{margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.status{display:inline-block;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.modal-back{position:fixed;inset:0;background:#17110dcc;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-back.open{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;gap:8px;margin-top:18px}.danger{background:#fff0f0;color:#a33;border:1px solid #f0caca}.success{background:#effaf4;color:#176844}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}.hero-grid,.cart-layout{grid-template-columns:1fr}.dash-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:5px}.side-link{min-width:max-content}.stats{grid-template-columns:repeat(2,1fr)}.summary{position:static}}
@media(max-width:560px){.container{width:94%}.nav{min-height:64px}.brand strong{font-size:18px}.nav-btn{padding:8px 10px}.hero{padding:40px 0}.hero h1{font-size:38px}.products{gap:12px}.product-img{height:210px}.product-body{padding:12px}.product-body p{min-height:auto;font-size:12px}.price{font-size:17px}.cart-row{grid-template-columns:62px 1fr auto}.cart-row img{width:62px;height:75px}.cart-row .qty{grid-column:2}.cart-row .remove{grid-column:3;grid-row:1/3}.dash-main{padding:15px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">L</span><strong>Lulu Store</strong></a><a class="nav-btn" href="index.html">متابعة التسوق</a></div></header><main class="container cart-page"><div class="section-head"><div><h2>السلة</h2><p id="userText">جاري التحقق من الحساب...</p></div></div><div class="cart-layout"><section class="cart-list"><div id="items"></div></section><aside class="summary"><h3>ملخص الطلب</h3><div class="total-line"><span>الإجمالي</span><span><span id="total">0</span> جنيه</span></div><div class="notice">بيانات التوصيل إلزامية حتى نقدر نسجل الطلب بشكل صحيح.</div><div class="field"><label>الاسم بالكامل</label><input id="name" placeholder="الاسم"></div><div class="field"><label>رقم الهاتف</label><input id="phone" placeholder="01xxxxxxxxx"></div><div class="field"><label>المحافظة</label><input id="gov" placeholder="المحافظة"></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="address" rows="3" placeholder="الشارع، المنطقة، رقم المنزل..."></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes" rows="2" placeholder="اختياري"></textarea></div><button class="main-btn" id="submit">تأكيد الطلب</button><div id="msg"></div></aside></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY);let cart=JSON.parse(localStorage.getItem('lulu_cart')||'[]');const items=document.getElementById('items'),total=document.getElementById('total'),msg=document.getElementById('msg');async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=checkout.html';return}document.getElementById('userText').textContent='الحساب: '+(session.user.email||'');if(!cart.length){items.innerHTML='<div class="empty">السلة فارغة.<br><br><a href="index.html">اختاري منتجاتك أولاً</a></div>';return}render()}function render(){items.innerHTML=cart.map((x,i)=>'<div class="cart-row"><img src="'+(x.image||'')+'" alt=""><div><strong>'+x.name+'</strong><div class="muted">'+Number(x.price).toLocaleString('ar-EG')+' جنيه</div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><b>'+x.quantity+'</b><button onclick="changeQty('+i+',1)">+</button><button class="remove" onclick="removeItem('+i+')">حذف</button></div></div><strong>'+Number(x.price*x.quantity).toLocaleString('ar-EG')+' جنيه</strong></div>').join('');total.textContent=cart.reduce((s,x)=>s+Number(x.price)*x.quantity,0).toLocaleString('ar-EG')}window.changeQty=(i,d)=>{cart[i].quantity+=d;if(cart[i].quantity<1)cart.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(cart));render()};window.removeItem=i=>{cart.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(cart));render()};document.getElementById('submit').onclick=async()=>{if(!cart.length)return;const customer_name=document.getElementById('name').value.trim(),phone=phoneEl.value.trim(),address=addressEl.value.trim();if(!customer_name||!phone||!address){msg.className='notice';msg.textContent='أكملي الاسم ورقم الهاتف والعنوان.';return}msg.className='notice';msg.textContent='جارٍ تسجيل الطلب...';const{data,error}=await sb.rpc('place_order',{p_customer_name:customer_name,p_phone:phone,p_governorate:gov.value.trim(),p_address:address,p_notes:notes.value.trim(),p_items:cart.map(x=>({product_id:x.id,quantity:x.quantity}))});if(error){msg.textContent='تعذر تسجيل الطلب حالياً. حاولي مرة أخرى.';return}localStorage.removeItem('lulu_cart');cart=[];render();msg.className='notice success';msg.textContent='تم تسجيل طلبك بنجاح. رقم الطلب: '+data};const phoneEl=document.getElementById('phone'),addressEl=document.getElementById('address');init();</script></body></html>
