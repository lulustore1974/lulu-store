<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة وإتمام الطلب | Lulu Store</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">L</span><strong>Lulu Store</strong></a><a class="nav-btn" href="index.html">متابعة التسوق</a></div></header><main class="container cart-page"><div class="section-head"><div><h2>السلة</h2><p id="userText">جاري التحقق من الحساب...</p></div></div><div class="cart-layout"><section class="cart-list"><div id="items"></div></section><aside class="summary"><h3>ملخص الطلب</h3><div class="total-line"><span>الإجمالي</span><span><span id="total">0</span> جنيه</span></div><div class="notice">بيانات التوصيل إلزامية حتى نقدر نسجل الطلب بشكل صحيح.</div><div class="field"><label>الاسم بالكامل</label><input id="name" placeholder="الاسم"></div><div class="field"><label>رقم الهاتف</label><input id="phone" placeholder="01xxxxxxxxx"></div><div class="field"><label>المحافظة</label><input id="gov" placeholder="المحافظة"></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="address" rows="3" placeholder="الشارع، المنطقة، رقم المنزل..."></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes" rows="2" placeholder="اختياري"></textarea></div><button class="main-btn" id="submit">تأكيد الطلب</button><div id="msg"></div></aside></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY);let cart=JSON.parse(localStorage.getItem('lulu_cart')||'[]');const items=document.getElementById('items'),total=document.getElementById('total'),msg=document.getElementById('msg');async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=checkout.html';return}document.getElementById('userText').textContent='الحساب: '+(session.user.email||'');if(!cart.length){items.innerHTML='<div class="empty">السلة فارغة.<br><br><a href="index.html">اختاري منتجاتك أولاً</a></div>';return}render()}function render(){items.innerHTML=cart.map((x,i)=>'<div class="cart-row"><img src="'+(x.image||'')+'" alt=""><div><strong>'+x.name+'</strong><div class="muted">'+Number(x.price).toLocaleString('ar-EG')+' جنيه</div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><b>'+x.quantity+'</b><button onclick="changeQty('+i+',1)">+</button><button class="remove" onclick="removeItem('+i+')">حذف</button></div></div><strong>'+Number(x.price*x.quantity).toLocaleString('ar-EG')+' جنيه</strong></div>').join('');total.textContent=cart.reduce((s,x)=>s+Number(x.price)*x.quantity,0).toLocaleString('ar-EG')}window.changeQty=(i,d)=>{cart[i].quantity+=d;if(cart[i].quantity<1)cart.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(cart));render()};window.removeItem=i=>{cart.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(cart));render()};document.getElementById('submit').onclick=async()=>{if(!cart.length)return;const customer_name=name.value.trim(),phone=phoneEl.value.trim(),address=addressEl.value.trim();if(!customer_name||!phone||!address){msg.className='notice';msg.textContent='أكملي الاسم ورقم الهاتف والعنوان.';return}msg.className='notice';msg.textContent='جارٍ تسجيل الطلب...';const{data,error}=await sb.rpc('place_order',{p_customer_name:customer_name,p_phone:phone,p_governorate:gov.value.trim(),p_address:address,p_notes:notes.value.trim(),p_items:cart.map(x=>({product_id:x.id,quantity:x.quantity}))});if(error){msg.textContent='تعذر تسجيل الطلب حالياً. حاولي مرة أخرى.';return}localStorage.removeItem('lulu_cart');cart=[];render();msg.className='notice success';msg.textContent='تم تسجيل طلبك بنجاح. رقم الطلب: '+data};const phoneEl=document.getElementById('phone'),addressEl=document.getElementById('address');init();</script></body></html>
