<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب</title><style>body{font-family:Arial;max-width:700px;margin:30px auto;padding:15px}input,textarea,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}button{background:#ff7300;color:white;border:0;border-radius:8px}.item{padding:10px;border-bottom:1px solid #ddd}</style><h1>Lulu Store - إتمام الطلب</h1><div id="items"></div><h3>البيانات</h3><input id="n" placeholder="الاسم"><input id="p" placeholder="رقم الهاتف"><input id="g" placeholder="المحافظة"><textarea id="a" placeholder="العنوان"></textarea><textarea id="x" placeholder="ملاحظات"></textarea><button id="go">تأكيد الطلب</button><p id="m"></p><a href="index.html">العودة للمتجر</a><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const s=createClient(SUPABASE_URL,SUPABASE_KEY),m=document.getElementById('m');let c=JSON.parse(localStorage.getItem('lulu_cart')||'[]');const r=()=>document.getElementById('items').innerHTML=c.length?c.map((q,i)=>'<div class="item">'+q.name+' × '+q.quantity+' — '+q.price*q.quantity+' جنيه <button onclick="del('+i+')">حذف</button></div>').join(''):'السلة فارغة';window.del=i=>{c.splice(i,1);localStorage.setItem('lulu_cart',JSON.stringify(c));r()};document.getElementById('go').onclick=async()=>{if(!c.length)return m.textContent='السلة فارغة';if(!n.value||!p.value||!a.value)return m.textContent='أكمل الاسم والهاتف والعنوان';m.textContent='جارٍ تسجيل الطلب...';const z=await s.rpc('place_order',{p_customer_name:n.value,p_phone:p.value,p_governorate:g.value,p_address:a.value,p_notes:x.value,p_items:c.map(q=>({product_id:q.id,quantity:q.quantity}))});if(z.error)return m.textContent='تعذر تسجيل الطلب';localStorage.removeItem('lulu_cart');c=[];r();m.textContent='تم تسجيل الطلب بنجاح';};r();</script></html>
