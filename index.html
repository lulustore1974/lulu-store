<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b85d35"><title>Lulu Store</title>
<style>
:root{--accent:#b85d35;--dark:#211a17;--muted:#756b65;--bg:#f7f2ed;--card:#fff;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--dark)}
a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.container{width:min(1180px,92%);margin:auto}
.site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;font-weight:800;font-size:21px}.brand strong{font-size:22px}.actions{display:flex;gap:8px}.nav-btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:12px;font-weight:700}.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.count{display:inline-grid;place-items:center;min-width:22px;height:22px;background:#fff;color:var(--accent);border-radius:50%;margin-right:5px}.menu{position:absolute;top:62px;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px #2b1a1018;min-width:170px;overflow:hidden;z-index:30}.menu a{display:block;padding:13px 16px;font-weight:700}.menu a:hover{background:#f8f1ed}.nav{position:relative}
.hero{padding:62px 0;background:linear-gradient(135deg,#fff,#f0e0d5)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.15;margin:0 0 16px}.hero h1 span{color:var(--accent)}.hero p{font-size:17px;color:var(--muted);line-height:2;margin:0 0 24px}.hero-card{min-height:310px;border-radius:28px;padding:30px;background:linear-gradient(145deg,#211a17,#9a5c40);color:#fff;display:flex;flex-direction:column;justify-content:flex-end}.hero-card .big{font-size:32px;font-weight:800}.hero-card h2{margin:8px 0}
main.container{padding:42px 0 70px}.section-head h2{font-size:28px;margin:0 0 6px}.section-head p{color:var(--muted);margin:0}.categories{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 32px}.chip{padding:9px 15px;border:1px solid var(--line);background:#fff;border-radius:30px;font-weight:700}.chip.active{background:var(--dark);color:#fff}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}.product:hover{transform:translateY(-3px);box-shadow:0 10px 24px #2b1a1012}.product-img{height:280px;background:#eee}.product-img img{width:100%;height:100%;object-fit:cover}.product-body{padding:17px}.product-body h3{margin:0 0 7px}.product-body p{color:var(--muted);min-height:42px;line-height:1.7}.price{font-size:20px;font-weight:800;color:var(--accent);margin:10px 0}.add{width:100%;padding:12px;border:0;border-radius:11px;background:var(--dark);color:#fff;font-weight:700}.empty{padding:35px;background:#fff;border:1px dashed #d5c8be;border-radius:18px;text-align:center;grid-column:1/-1}
.footer{padding:32px 0;background:var(--dark);color:#fff}.footer p{color:#bbb}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}.hero-grid{grid-template-columns:1fr}}
@media(max-width:560px){.container{width:94%}.nav{min-height:64px}.brand strong{font-size:18px}.nav-btn{padding:8px 10px}.hero{padding:42px 0}.hero h1{font-size:38px}.products{gap:12px}.product-img{height:210px}.product-body{padding:12px}.product-body p{min-height:auto;font-size:13px}.price{font-size:17px}}
</style>
</head>
<body>
<header class="site-header"><div class="container nav">
<a class="brand" href="index.html"><span class="brand-mark">L</span><strong>Lulu Store</strong></a>
<nav class="actions">
<a class="nav-btn" href="login.html?next=index.html" id="authBtn">تسجيل الدخول</a>
<button class="nav-btn" id="menuBtn" aria-label="القائمة" style="display:none">☰</button>
<button class="nav-btn primary" id="cartBtn" style="display:none">السلة <span class="count" id="cartCount">0</span></button>
<div id="menu" class="menu" style="display:none"><a href="customer.html">طلباتي</a><a href="#" id="logoutBtn">تسجيل الخروج</a></div>
</nav>
</div></header>

<section class="hero"><div class="container hero-grid">
<div><h1>منتجاتك من <span>Lulu Store</span></h1><p>تصفحي الأقسام والمنتجات، ثم أضف المنتجات التي تريدها إلى السلة.</p><a class="nav-btn primary" href="#products">تصفح المنتجات</a></div>
<div class="hero-card"><div class="big">LULU</div><h2>اختياراتك في مكان واحد</h2></div>
</div></section>

<main class="container">
<div class="section-head"><h2>الأقسام</h2></div><div class="categories" id="cats"></div>
<div class="section-head" id="products"><h2>المنتجات</h2><p id="resultText">جاري التحميل...</p></div>
<div class="products" id="productGrid"><div class="empty">جاري التحميل...</div></div>
</main>

<footer class="footer"><div class="container"><div class="brand"><span class="brand-mark">L</span><strong>Lulu Store</strong></div></div></footer>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const cartBtn=document.getElementById('cartBtn'),menuBtn=document.getElementById('menuBtn'),menu=document.getElementById('menu'),logoutBtn=document.getElementById('logoutBtn'),grid=document.getElementById('productGrid'),cats=document.getElementById('cats'),count=document.getElementById('cartCount'),authBtn=document.getElementById('authBtn');
let products=[],category='all';
async function getSession(){return(await sb.auth.getSession()).data.session}
function getCart(){try{return JSON.parse(localStorage.getItem('lulu_cart')||'[]')}catch{return[]}}
function refreshCount(){count.textContent=getCart().reduce((n,x)=>n+Number(x.quantity||0),0)}
async function openCart(){const s=await getSession();location.href=s?'checkout.html':'login.html?next=checkout.html'}
cartBtn.onclick=openCart;
async function add(id){
 const s=await getSession();
 if(!s){location.href='login.html?next=checkout.html';return}
 const p=products.find(x=>x.id===id);if(!p)return;
 const c=getCart(),old=c.find(x=>x.id===id);
 if(old)old.quantity++;else c.push({id:p.id,name:p.name,price:Number(p.price),image:p.image,quantity:1});
 localStorage.setItem('lulu_cart',JSON.stringify(c));refreshCount();
}
window.addToCart=add;
function render(){
 const list=category==='all'?products:products.filter(p=>p.category_id===category);
 document.getElementById('resultText').textContent=list.length+' منتج';
 grid.innerHTML=list.length?list.map(p=>'<article class="product" onclick="location.href='product.html?id='+encodeURIComponent(p.id)"><div class="product-img"><img loading="lazy" src="'+(p.image||'')+'" alt="'+p.name+'"></div><div class="product-body"><h3>'+p.name+'</h3><p>'+((p.description||'').replaceAll('<','&lt;'))+'</p><div class="price">'+Number(p.price).toLocaleString('ar-EG')+' جنيه</div><button class="add" onclick="event.stopPropagation();addToCart(\''+p.id+'\')">أضف للسلة</button></div></article>').join(''):'<div class="empty">لا توجد منتجات في هذا القسم حالياً.</div>';
}
async function load(){
 const[c,p]=await Promise.all([
  sb.from('categories').select('id,name').eq('active',true).order('sort_order'),
  sb.from('products').select('id,category_id,name,description,price,product_images(image_url,sort_order)').eq('active',true).order('created_at',{ascending:false})
 ]);
 if(c.error||p.error){grid.innerHTML='<div class="empty">تعذر تحميل المنتجات.</div>';return}
 products=(p.data||[]).map(x=>({...x,image:(x.product_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0]?.image_url||''}));
 cats.innerHTML='<button class="chip active" data-id="all">الكل</button>'+(c.data||[]).map(x=>'<button class="chip" data-id="'+x.id+'">'+x.name+'</button>').join('');
 cats.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{category=b.dataset.id;cats.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
 render();refreshCount();
 const s=await getSession();
 if(s){cartBtn.style.display='inline-flex';menuBtn.style.display='inline-flex';authBtn.style.display='none';logoutBtn.onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.reload()};menuBtn.onclick=()=>menu.style.display=menu.style.display==='none'?'block':'none';}else{cartBtn.style.display='none';menuBtn.style.display='none';authBtn.style.display='inline-flex'}
}
load();
</script>
\n</body></html>
