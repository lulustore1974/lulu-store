<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lulu Store</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8f8f8;color:#222}header{background:#ff7a00;color:#fff;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0}.links a{background:#fff;color:#d85f00;padding:9px 14px;border-radius:10px;text-decoration:none;margin:3px}.hero{text-align:center;background:#fff;padding:40px 15px}.cats{display:flex;gap:8px;overflow:auto;padding:15px 6%;background:#fff}.cat{border:1px solid #ddd;background:#fff;border-radius:25px;padding:9px 16px;white-space:nowrap}.active{background:#ff7a00;color:#fff}.grid{padding:25px 6%;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #eee;box-shadow:0 5px 20px #0001}.card img{width:100%;height:280px;object-fit:cover}.body{padding:15px}.price{font-size:21px;font-weight:bold;color:#e56600}.desc{color:#666;min-height:45px}.add{width:100%;padding:12px;background:#ff7a00;color:#fff;border:0;border-radius:10px;cursor:pointer}.cart{position:fixed;left:18px;bottom:18px;background:#222;color:#fff;padding:13px 18px;border-radius:30px}.empty{text-align:center;grid-column:1/-1;padding:50px;color:#777}footer{text-align:center;background:#222;color:#fff;padding:25px}</style></head>
<body><header><h1>Lulu Store</h1><div class="links"><a href="login.html">تسجيل الدخول</a><a href="checkout.html">السلة 🛒</a></div></header><section class="hero"><h2>أهلاً بك في Lulu Store</h2><p>اختاري منتجاتك وأكملي الطلب بسهولة.</p></section><div class="cats" id="cats"></div><main class="grid" id="products"><div class="empty">جاري تحميل المنتجات...</div></main><div class="cart" onclick="location.href='checkout.html'">🛒 السلة (<span id="count">0</span>)</div><footer>Lulu Store — جميع الحقوق محفوظة</footer>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY);let all=[],selected='all',cart=JSON.parse(localStorage.getItem('lulu_cart')||'[]');const el=document.getElementById('products'),cats=document.getElementById('cats');function save(){localStorage.setItem('lulu_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.reduce((n,x)=>n+x.quantity,0)}window.addCart=id=>{const p=all.find(x=>x.id===id);if(!p)return;const q=cart.find(x=>x.id===id);q?q.quantity++:cart.push({id:p.id,name:p.name,price:p.price,image:p.image,quantity:1});save();alert('تمت إضافة المنتج للسلة')};function render(){const list=selected==='all'?all:all.filter(p=>p.category_id===selected);el.innerHTML=list.length?list.map(p=>'<article class="card"><img src="'+(p.image||'https://via.placeholder.com/600x700')+'" alt="'+p.name+'"><div class="body"><h3>'+p.name+'</h3><div class="price">'+Number(p.price).toFixed(2)+' جنيه</div><p class="desc">'+(p.description||'')+'</p><button class="add" onclick="addCart(\''+p.id+'\')">أضف للسلة</button></div></article>').join(''):'<div class="empty">لا توجد منتجات حالياً.</div>'}async function load(){const[c,p]=await Promise.all([sb.from('categories').select('id,name').eq('active',true).order('sort_order'),sb.from('products').select('id,category_id,name,description,price,product_images(image_url,sort_order)').eq('active',true).order('created_at',{ascending:false})]);if(c.error||p.error){el.innerHTML='<div class="empty">تعذر تحميل المنتجات.</div>';return}all=p.data.map(x=>({...x,image:(x.product_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0]?.image_url||''}));cats.innerHTML='<button class="cat active" data-id="all">الكل</button>'+c.data.map(x=>'<button class="cat" data-id="'+x.id+'">'+x.name+'</button>').join('');cats.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selected=b.dataset.id;cats.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render();save()}load();
</script></body></html>
