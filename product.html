<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b85d35"><title>تفاصيل المنتج | Lulu Store</title>
<style>
:root{--accent:#b85d35;--dark:#211a17;--muted:#756b65;--bg:#f7f2ed;--card:#fff;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--dark)}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.container{width:min(1120px,92%);margin:auto}
.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;font-weight:800;font-size:20px}.brand strong{font-size:21px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:12px;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:35px 0 70px}.back{display:inline-block;margin-bottom:18px;color:var(--muted);font-weight:700}.product-card{display:grid;grid-template-columns:1.05fr .95fr;gap:38px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 12px 35px #2b1a1010}.gallery-main{height:560px;border-radius:20px;overflow:hidden;background:#f0ebe7;position:relative;cursor:zoom-in}.gallery-main img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:10px;overflow:auto;margin-top:12px}.thumb{width:72px;height:78px;flex:0 0 72px;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#f4f0ed;padding:0}.thumb.active{border-color:var(--accent)}.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:10px 4px}.info h1{font-size:38px;margin:0 0 10px}.desc{color:var(--muted);line-height:1.9;font-size:16px}.price{font-size:28px;font-weight:800;color:var(--accent);margin:20px 0}.old{font-size:15px;color:#aaa;text-decoration:line-through;margin-right:8px}.label{display:block;font-weight:800;margin:20px 0 9px}.options{display:flex;gap:8px;flex-wrap:wrap}.option{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-width:52px}.option.selected{border-color:var(--accent);background:#fbede5;color:var(--accent);font-weight:800}.option.disabled{opacity:.4;cursor:not-allowed}.quantity{display:flex;align-items:center;gap:10px}.qtybtn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff}.qty{min-width:34px;text-align:center;font-weight:800}.add{width:100%;margin-top:24px;padding:15px;border:0;border-radius:13px;background:var(--dark);color:#fff;font-weight:800;font-size:17px}.notice{margin-top:12px;color:var(--muted);min-height:24px}.stock-info{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f7f1ed;font-weight:700}.stock-info.out{color:#a33;background:#fff0f0}.zoom{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:25px;z-index:100}.zoom.show{display:flex}.zoom img{max-width:95vw;max-height:90vh;object-fit:contain}.close{position:absolute;top:18px;right:20px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;font-size:25px}
@media(max-width:800px){.product-card{grid-template-columns:1fr;gap:22px;padding:15px}.gallery-main{height:430px}.info h1{font-size:30px}}@media(max-width:500px){.container{width:94%}.nav{min-height:64px}.btn{padding:8px 10px}.gallery-main{height:350px}}
</style></head>
<body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a><div class="actions"><a class="btn" href="index.html">المتجر</a><a class="btn" href="customer.html" id="orders" style="display:none">طلباتي</a><button class="btn primary" id="cart">السلة</button></div></div></header>
<main class="container"><a class="back" href="index.html">← العودة للمنتجات</a><div id="root"><div class="product-card">جاري تحميل المنتج...</div></div></main>
<div class="zoom" id="zoom"><button class="close" id="close">×</button><img id="zoomImg" alt=""></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),root=document.getElementById('root'),cart=document.getElementById('cart'),orders=document.getElementById('orders');
const id=new URLSearchParams(location.search).get('id');let p,variants=[],images=[],selectedSize='',selectedColor='',qty=1,mainImage='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cartData=()=>{try{return JSON.parse(localStorage.getItem('lulu_cart')||'[]')}catch{return[]}};
async function session(){return(await sb.auth.getSession()).data.session}
function render(){
 const sizes=[...new Set(variants.map(v=>v.size).filter(Boolean))],colors=[...new Set(variants.map(v=>v.color).filter(Boolean))];
 root.innerHTML='<div class="product-card"><div><div class="gallery-main" id="mainPhoto"><img src="'+esc(mainImage)+'" alt="'+esc(p.name)+'"></div><div class="thumbs">'+images.map((x,i)=>'<button class="thumb '+(i===0?'active':'')+'" data-i="'+i+'"><img src="'+esc(x.image_url)+'" alt=""></button>').join('')+'</div></div><div class="info"><h1>'+esc(p.name)+'</h1><div class="desc">'+esc(p.description||'')+'</div><div class="price">'+Number(p.price).toLocaleString('ar-EG')+' جنيه '+(p.old_price?'<span class="old">'+Number(p.old_price).toLocaleString('ar-EG')+' جنيه</span>':'')+'</div>'+(sizes.length?'<span class="label">المقاس</span><div class="options" id="sizes">'+sizes.map(x=>'<button class="option" data-size="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>':'')+(colors.length?'<span class="label">اللون</span><div class="options" id="colors">'+colors.map(x=>'<button class="option" data-color="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>':'')+'<div class="stock-info" id="stockInfo"></div><span class="label">الكمية</span><div class="quantity"><button class="qtybtn" id="minus">−</button><span class="qty" id="qty">1</span><button class="qtybtn" id="plus">+</button></div><button class="add" id="add">أضف للسلة</button><div class="notice" id="notice"></div></div></div>';
 document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{mainImage=images[Number(b.dataset.i)].image_url;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.gallery-main img').src=mainImage});
 document.getElementById('mainPhoto').onclick=()=>{document.getElementById('zoomImg').src=mainImage;document.getElementById('zoom').classList.add('show')};
 document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{selectedSize=b.dataset.size;qty=1;document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');updateStockDisplay()});
 document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;qty=1;document.querySelectorAll('[data-color]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');updateStockDisplay()});
 document.getElementById('minus').onclick=()=>{qty=Math.max(1,qty-1);document.getElementById('qty').textContent=qty};
 document.getElementById('plus').onclick=()=>{const stock=availableStock();qty=Math.min(stock||99,qty+1);document.getElementById('qty').textContent=qty};
 document.getElementById('add').onclick=add;updateStockDisplay();
}
function selectedVariant(){if(!variants.length)return null;return variants.find(v=>(!v.size||v.size===selectedSize)&&(!v.color||v.color===selectedColor))||null}function availableStock(){const v=selectedVariant();return v?Math.max(0,Number(v.stock||0)):0}function updateStockDisplay(){const el=document.getElementById('stockInfo');if(!el)return;if(!variants.length){el.textContent='الكمية المتاحة: غير محددة';return}const v=selectedVariant();const stock=v?Math.max(0,Number(v.stock||0)):0;el.className='stock-info'+(stock===0?' out':'');el.textContent=v?(stock>0?'المتاح: '+stock+' قطعة':'غير متاح حالياً'):'اختر المقاس واللون لمعرفة الكمية المتاحة';const plus=document.getElementById('plus');if(plus)plus.disabled=stock===0||qty>=stock;const q=document.getElementById('qty');if(q){if(stock>0)qty=Math.min(qty,stock);q.textContent=qty}}function variantValid(){return availableStock()>0}
async function add(){
 const s=await session();if(!s){location.href='login.html?next='+encodeURIComponent('product.html?id='+id);return}
 if(variants.length&&((variants.some(v=>v.size)&&!selectedSize)||(variants.some(v=>v.color)&&!selectedColor))){document.getElementById('notice').textContent='يرجى اختيار المقاس واللون المتاحين قبل الإضافة.';return}
 if(variants.length&&!variantValid()){document.getElementById('notice').textContent='الاختيار المحدد غير متاح حالياً.';return}if(variants.length&&qty>availableStock()){document.getElementById('notice').textContent='الكمية المطلوبة أكبر من المتاح.';return}
 let c=cartData(),key=id+'|'+selectedSize+'|'+selectedColor,old=c.find(x=>x.key===key);
 if(old)old.quantity=Math.min(99,old.quantity+qty);else c.push({key,id:p.id,name:p.name,price:Number(p.price),image:mainImage,quantity:qty,size:selectedSize,color:selectedColor});
 localStorage.setItem('lulu_cart',JSON.stringify(c));document.getElementById('notice').textContent='تمت إضافة المنتج إلى السلة.'; 
}
cart.onclick=async()=>{const s=await session();location.href=s?'checkout.html':'login.html?next=checkout.html'};
document.getElementById('close').onclick=()=>document.getElementById('zoom').classList.remove('show');
document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')e.currentTarget.classList.remove('show')};
async function load(){
 if(!id){root.innerHTML='<div class="product-card">المنتج غير موجود.</div>';return}
 const r=await sb.from('products').select('id,name,description,price,old_price,product_images(image_url,sort_order),product_variants(id,size,color,stock)').eq('id',id).eq('active',true).maybeSingle();
 if(r.error||!r.data){root.innerHTML='<div class="product-card">تعذر تحميل المنتج.</div>';return}
 p=r.data;images=(p.product_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));variants=p.product_variants||[];mainImage=images[0]?.image_url||'';render();
 const s=await session();if(s)orders.style.display='inline-block';
}
load();
</script>
</body></html>
