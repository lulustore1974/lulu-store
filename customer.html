<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلباتي | Lulu Store</title>
<style>
:root{--a:#b85d35;--d:#211a17;--m:#756b65;--bg:#f7f2ed;--line:#eadfd7;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--d)}
a{text-decoration:none;color:inherit}button,select{font:inherit;cursor:pointer}.container{width:min(1050px,92%);margin:auto}
.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--d);color:#fff;font-weight:800;font-size:20px}.brand strong{font-size:21px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:700}.primary{background:var(--a);color:#fff;border-color:var(--a)}
main{padding:38px 0 70px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:34px}.muted{color:var(--m);line-height:1.8}.empty,.order{background:var(--card);border:1px solid var(--line);border-radius:20px}.empty{padding:45px;text-align:center}.order{padding:20px;margin-bottom:15px;box-shadow:0 8px 25px #2b1a1010}.order-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.order-number{font-size:19px;font-weight:800}.date{font-size:13px;color:var(--m);margin-top:4px}.status{padding:7px 12px;border-radius:30px;font-size:12px;font-weight:800}.status.new{background:#fff4e8;color:#9b4d18}.status.confirmed{background:#eef5ff;color:#315d99}.status.processing{background:#f5efff;color:#6848a0}.status.shipped{background:#eefaf6;color:#22705a}.status.completed{background:#eaf8ef;color:#23734a}.status.cancelled{background:#fff0f0;color:#a33}
.items{display:flex;flex-direction:column;gap:8px;margin:16px 0}.item{display:flex;align-items:center;gap:11px;padding:9px;background:#faf7f4;border-radius:12px}.item img{width:55px;height:65px;object-fit:cover;border-radius:9px;background:#eee}.item-info{flex:1;min-width:0}.item-info b{display:block}.meta{font-size:12px;color:var(--m);margin-top:4px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-weight:800;font-size:18px}
@media(max-width:600px){.container{width:94%}.nav{min-height:64px}.head{align-items:stretch;flex-direction:column}.head h1{font-size:29px}.order{padding:15px}.order-head{align-items:flex-start}.item img{width:48px;height:58px}.btn{padding:9px 11px}}
</style></head>
<body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a><div class="actions"><a class="btn" href="index.html">المتجر</a><button class="btn primary" id="logout">تسجيل الخروج</button></div></div></header>
<main class="container"><div class="head"><div><h1>طلباتي</h1><div class="muted">متابعة حالة كل طلب وتفاصيل المنتجات.</div></div></div><div id="orders"><div class="empty">جاري تحميل الطلبات...</div></div></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),root=document.getElementById('orders');
const labels={new:'جديد',confirmed:'تم التأكيد',processing:'قيد التجهيز',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغي'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){location.href='login.html?next=customer.html';return}
 const{data:orders,error}=await sb.from('orders').select('id,customer_name,phone,governorate,address,total,status,created_at,order_items(product_name,price,size,color,quantity,subtotal,product_id)').eq('customer_id',session.user.id).order('created_at',{ascending:false});
 if(error){root.innerHTML='<div class="empty">تعذر تحميل الطلبات حالياً.</div>';return}
 if(!orders?.length){root.innerHTML='<div class="empty"><h2>لا توجد طلبات بعد</h2><p class="muted">عند تسجيل أول طلب سيظهر هنا ويمكن متابعة حالته.</p><a class="btn primary" href="index.html">ابدأ التسوق</a></div>';return}
 const ids=[...new Set(orders.flatMap(o=>(o.order_items||[]).map(i=>i.product_id)).filter(Boolean))];
 let imgs={};
 if(ids.length){const r=await sb.from('product_images').select('product_id,image_url,sort_order').in('product_id',ids).order('sort_order');(r.data||[]).forEach(x=>{if(!imgs[x.product_id])imgs[x.product_id]=x.image_url})}
 root.innerHTML=orders.map(o=>'<article class="order"><div class="order-head"><div><div class="order-number">طلب #'+esc(o.id.slice(0,8))+'</div><div class="date">'+new Date(o.created_at).toLocaleString('ar-EG')+'</div></div><span class="status '+esc(o.status)+'">'+(labels[o.status]||esc(o.status))+'</span></div><div class="items">'+(o.order_items||[]).map(i=>'<div class="item">'+(imgs[i.product_id]?'<img src="'+esc(imgs[i.product_id])+'" alt="">':'<div class="item" style="width:55px;height:65px;justify-content:center;flex:0 0 55px">🛍️</div>')+'<div class="item-info"><b>'+esc(i.product_name)+'</b><div class="meta">'+i.quantity+' × '+Number(i.price||0).toLocaleString('ar-EG')+' جنيه'+(i.size?' · '+esc(i.size):'')+(i.color?' · '+esc(i.color):'')+'</div></div><strong>'+Number(i.subtotal||0).toLocaleString('ar-EG')+' ج</strong></div>').join('')+'</div><div class="total"><span>الإجمالي</span><span>'+Number(o.total||0).toLocaleString('ar-EG')+' جنيه</span></div></article>').join('');
}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};load();
</script>\n</body></html>
