<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعادة تعيين كلمة المرور | Lulu Store</title>
<style>
:root{--a:#b85d35;--d:#211a17;--m:#756b65;--bg:#f7f2ed;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#f1dfd2,#faf7f4);color:var(--d);min-height:100vh}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px #4b2b1b18}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--d);margin-bottom:28px}.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--d);color:#fff;font-weight:800;font-size:22px}.brand strong{font-size:23px}
h1{font-size:30px;margin:0 0 8px}p{color:var(--m);line-height:1.8}.field{margin:17px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #d9cec6;border-radius:12px;outline:none}.field input:focus{border-color:var(--a)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}.secondary{display:block;text-align:center;padding:13px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--d);font-weight:700;margin-top:12px}.msg{margin:12px 0;padding:11px 13px;border-radius:11px;background:#f7f1ed;color:#7f3e24}.success{background:#effaf4;color:#176844}
</style></head>
<body><main class="wrap"><section class="card">
<a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a>
<h1>إعادة تعيين كلمة المرور</h1>
<p>أدخل كلمة المرور الحالية، ثم اختر كلمة مرور جديدة.</p>
<div id="msg"></div>
<div class="field"><label for="current">كلمة المرور الحالية</label><input id="current" type="password" autocomplete="current-password"></div>
<div class="field"><label for="new1">كلمة المرور الجديدة</label><input id="new1" type="password" minlength="6" autocomplete="new-password"></div>
<div class="field"><label for="new2">تأكيد كلمة المرور الجديدة</label><input id="new2" type="password" minlength="6" autocomplete="new-password"></div>
<button class="btn" id="save">حفظ كلمة المرور الجديدة</button>
<a class="secondary" href="index.html">العودة إلى المتجر</a>
</section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),msg=document.getElementById('msg');
const show=(t,ok=false)=>{msg.className='msg '+(ok?'success':'');msg.textContent=t};
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=reset-password.html';return}}
document.getElementById('save').onclick=async()=>{
 const current=document.getElementById('current').value,new1=document.getElementById('new1').value,new2=document.getElementById('new2').value;
 if(!current||new1.length<6||new1!==new2){show('تأكد من كلمة المرور الحالية وكلمة المرور الجديدة وتطابق التأكيد.');return}
 const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next=reset-password.html';return}
 show('جارٍ التحقق من كلمة المرور الحالية...');
 const email=session.user.email;
 const{error:verifyError}=await sb.auth.signInWithPassword({email,password:current});
 if(verifyError){show('كلمة المرور الحالية غير صحيحة.');return}
 const{error}=await sb.auth.updateUser({password:new1});
 if(error){show(error.message||'تعذر تغيير كلمة المرور.');return}
 show('تم تغيير كلمة المرور بنجاح.',true);
 document.getElementById('current').value='';document.getElementById('new1').value='';document.getElementById('new2').value='';
};
init();
</script>
</body></html>
