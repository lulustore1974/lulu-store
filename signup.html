<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب | Lulu Store</title>
<style>
:root{--a:#b85d35;--d:#211a17;--m:#756b65;--line:#eadfd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#f1dfd2,#faf7f4);color:var(--d);min-height:100vh}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px #4b2b1b18}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--d);margin-bottom:28px}.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--d);color:#fff;font-weight:800;font-size:22px}.brand strong{font-size:23px}
h1{font-size:32px;margin:0 0 8px}p{color:var(--m);line-height:1.8}.field{margin:17px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #d9cec6;border-radius:12px;outline:none}.field input:focus{border-color:var(--a)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:800}.secondary{display:block;text-align:center;padding:13px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--d);font-weight:700;margin-top:12px}.msg{margin:12px 0;padding:11px 13px;border-radius:11px;background:#f7f1ed;color:#7f3e24}.success{background:#effaf4;color:#176844}
</style></head>
<body><main class="wrap"><section class="card">
<a class="brand" href="index.html"><span class="mark">L</span><strong>Lulu Store</strong></a>
<h1>إنشاء حساب جديد</h1><p>إنشاء حساب لاستخدام السلة وإتمام الطلبات.</p>
<div id="msg"></div>
<div class="field"><label for="name">الاسم بالكامل</label><input id="name" autocomplete="name"></div>
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+2010xxxxxxxx"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="new-password"></div>
<button class="btn" id="signup">إنشاء الحساب</button>
<a class="secondary" href="login.html">لديك حساب؟ تسجيل الدخول</a>
<a class="secondary" href="https://wa.me/201515899765" target="_blank" rel="noopener">الدعم الفني عبر واتساب</a>

</section></main>
<script type="module">\nimport{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_KEY}from'./js/config.js';const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const normalizePhone=s=>{const v=String(s||'').trim();return /^\+?[0-9]{8,15}$/.test(v)?(v.startsWith('+')?v:'+'+v):null};
const getCustomer=()=>{try{return JSON.parse(localStorage.getItem('lulu_customer')||'null')}catch{return null}};
const msg=document.getElementById('msg'),next=new URLSearchParams(location.search).get('next')||'index.html';
function show(t,ok=false){msg.className='msg '+(ok?'success':'');msg.textContent=t}
async function redirectIfLoggedIn(){const{data:{session}}=await sb.auth.getSession();if(session&&session.user.app_metadata?.role==='admin'){location.href='admin.html';return}if(getCustomer())location.href=next&&!next.startsWith('admin')?next:'index.html'}
redirectIfLoggedIn();
document.getElementById('signup').onclick=async()=>{const name=document.getElementById('name').value.trim(),phone=normalizePhone(document.getElementById('phone').value),password=document.getElementById('password').value;if(!name||!phone||password.length<6){show('أكمل الاسم ورقم الهاتف وكلمة المرور (6 أحرف على الأقل).');return}const btn=document.getElementById('signup');btn.disabled=true;btn.textContent='جارٍ إنشاء الحساب...';show('جارٍ إنشاء الحساب...');try{const{data,error}=await sb.rpc('customer_signup',{p_name:name,p_phone:phone,p_password:password});if(error){const m=(error.message||'').toLowerCase();show(m.includes('phone_exists')?'رقم الهاتف مستخدم بالفعل. جرّب تسجيل الدخول.':m.includes('invalid_phone')?'رقم الهاتف غير صحيح.':m.includes('weak_password')?'كلمة المرور يجب أن تكون 6 أحرف على الأقل.':'تعذر إنشاء الحساب حاليًا. حاول مرة أخرى.');return}localStorage.setItem('lulu_customer',JSON.stringify(data));show('تم إنشاء الحساب بنجاح، جارٍ فتح المتجر...',true);setTimeout(()=>location.href=next,400)}finally{btn.disabled=false;btn.textContent='إنشاء الحساب'}};
\n</script>\n</body></html>
